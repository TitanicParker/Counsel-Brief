<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Counsel Brief — Essays</title>
<meta name="description" content="A swipeable reading edition of the Counsel Brief essays.">
<style>
:root{--paper:#fff;--ink:#090909;--muted:#666;--line:#d8d8d8;--soft:#f5f5f3;--bar:64px;--max:760px}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--paper);color:var(--ink);font-family:Georgia,Cambria,"Times New Roman",serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.top{position:fixed;inset:0 0 auto;height:calc(var(--bar) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);z-index:20}.top button{height:44px;border:0;background:transparent;border-radius:50%;font:20px system-ui;cursor:pointer}.top button:hover{background:var(--soft)}.id{text-align:center;min-width:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.id b{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.id span{display:block;margin-top:3px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top) - 2px);left:0;right:0;height:2px;z-index:21}.progress i{display:block;height:100%;width:0;background:#000}.viewport{position:fixed;inset:calc(var(--bar) + env(safe-area-inset-top)) 0 0;overflow:hidden;touch-action:pan-y}.track{display:flex;width:100%;height:100%;transition:transform .34s cubic-bezier(.22,.8,.25,1);will-change:transform}.track.drag{transition:none}.slide{flex:0 0 100%;height:100%;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}.paper{width:min(calc(100% - 32px),var(--max));margin:auto;padding:clamp(32px,6vw,70px) 0 calc(110px + env(safe-area-inset-bottom))}.eyebrow{margin-bottom:17px;color:var(--muted);font:11px system-ui;letter-spacing:.14em;text-transform:uppercase}.title{margin:0 0 16px;font-size:clamp(38px,8vw,70px);line-height:.98;letter-spacing:-.045em}.deck{margin:0 0 28px;color:#333;font-size:clamp(18px,3.8vw,23px);line-height:1.45}.rule{border:0;border-top:1px solid #000;margin:28px 0 40px}.content{font-size:clamp(18px,3.7vw,21px);line-height:1.72;overflow-wrap:anywhere}.content>:first-child{margin-top:0}.content h1{font-size:clamp(32px,7vw,54px);line-height:1.04;letter-spacing:-.035em;margin:0 0 30px}.content h2{font-size:clamp(27px,5vw,38px);line-height:1.14;letter-spacing:-.025em;margin:2.5em 0 .7em}.content h3{font-size:clamp(22px,4vw,29px);line-height:1.2;margin:2em 0 .65em}.content p{margin:0 0 1.2em}.content ul,.content ol{padding-left:1.35em;margin:0 0 1.4em}.content li{margin:.35em 0}.content blockquote{margin:2em 0;padding:.2em 0 .2em 1.1em;border-left:4px solid #000;font-size:1.07em;line-height:1.55}.content blockquote p:last-child{margin-bottom:0}.content hr{border:0;border-top:1px solid var(--line);margin:3em 0}.content code{padding:.1em .3em;background:var(--soft);font: .84em ui-monospace,SFMono-Regular,Menlo,monospace}.content pre{overflow:auto;padding:16px;border:1px solid var(--line);background:var(--soft);font-size:14px}.content pre code{padding:0;background:transparent}.content a{color:inherit;text-underline-offset:3px}.content table{display:block;width:100%;overflow:auto;border-collapse:collapse;font-size:.9em}.content th,.content td{padding:8px 10px;border:1px solid var(--line);vertical-align:top}.loading,.error{margin:55px 0;color:var(--muted);font:15px system-ui}.source{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;font:13px system-ui}.source a{color:inherit}.dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:8px;padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 8px 28px rgba(0,0,0,.09);backdrop-filter:blur(12px);font-family:system-ui}.dock button{height:42px;min-width:42px;padding:0 14px;border:0;border-radius:999px;background:transparent;cursor:pointer}.dock button:hover{background:var(--soft)}.dock button:disabled{opacity:.25}.count{min-width:62px;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.drawer{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:1fr min(88vw,430px);visibility:hidden;pointer-events:none}.drawer.open{visibility:visible;pointer-events:auto}.scrim{background:rgba(0,0,0,.25);opacity:0;transition:opacity .2s}.drawer.open .scrim{opacity:1}.panel{height:100%;padding:calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));overflow:auto;border-left:1px solid var(--line);background:#fff;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);font-family:system-ui}.drawer.open .panel{transform:none}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.panelhead b{font-size:12px;letter-spacing:.14em;text-transform:uppercase}.panelhead button{width:42px;height:42px;border:0;border-radius:50%;background:transparent;font-size:22px}.toc{display:grid;gap:7px}.toc button{width:100%;padding:14px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}.toc button:hover{background:var(--soft)}.toc button.active{border-color:#000}.toc .n{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.toc .t{display:block;font-size:15px;font-weight:650;line-height:1.25}.toc .d{display:block;margin-top:5px;color:var(--muted);font-family:Georgia,serif;font-size:14px;line-height:1.35}@media(max-width:620px){:root{--bar:60px}.paper{width:calc(100% - 30px);padding-top:29px}.content{font-size:18.5px;line-height:1.68}.title{font-size:clamp(39px,12vw,60px)}}@media(prefers-reduced-motion:reduce){.track,.panel,.scrim{transition:none!important}}
</style>
</head>
<body>
<header class="top"><button id="menu" aria-label="Open contents">☰</button><div class="id"><b>Counsel Brief</b><span id="current">Essays</span></div><button id="top" aria-label="Back to top">↑</button></header>
<div class="progress"><i id="bar"></i></div>
<main class="viewport" id="viewport"><div class="track" id="track"></div></main>
<nav class="dock" aria-label="Essay navigation"><button id="prev" aria-label="Previous essay">←</button><span class="count" id="count">1 / 1</span><button id="next" aria-label="Next essay">→</button></nav>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="scrim" id="scrim"></div><div class="panel" role="dialog" aria-modal="true" aria-label="Essay contents"><div class="panelhead"><b>Contents</b><button id="close" aria-label="Close contents">×</button></div><div class="toc" id="toc"></div></div></aside>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const essays=[
{slug:'allegation',file:'readme.md',title:'The Allegation',deck:'The management frame, the Protest, the fork in the road, and the durable account.'},
{slug:'discharge-artefact',file:'09_DISCHARGE_ARTEFACT_FINDINGS_FOR_ALLEGATION.md',title:'The Discharge Artefact',deck:'Why the completed July 2017 document is a layered synthesis rather than a bedside snapshot.'},
{slug:'questions',file:'10_QUESTIONS_THE_ALLEGATION_MAKES_UNAVOIDABLE.md',title:'The Questions',deck:'The factual, documentary and clinical questions the allegation now has to survive.'},
{slug:'clinical-facts',file:'11_CLINICAL_FACTS_CLARIFYING_THE_MANAGEMENT_FRAME.md',title:'Clinical Facts',deck:'The treating record in its own words: origin, continuity and later defence of the management approach.'},
{slug:'consequences',file:'12_REAL_WORLD_CONSEQUENCES (1).md',title:'Real World Consequences',deck:'The survival of a frame in the presence of accumulating neurological information.'},
{slug:'documentary-settlement',file:'13_THE_DOCUMENTARY_SETTLEMENT.md',title:'The Documentary Settlement',deck:'How an unresolved bedside ending became the settled documentary account that could travel forward.'},
{slug:'not-clear',file:'Not-clear',title:'The Extraordinary Inertia of “Not Clear”',deck:'How legitimate uncertainty can become durable when no mechanism for reopening it is preserved.'},
{slug:'record',file:'complete-record-forensic-expanded.md',title:'The Complete Record',deck:'The evidential spine: the underlying longitudinal compilation from which the essays are tested.'}
];
const repo='https://github.com/TitanicParker/Counsel-Brief/blob/main/';
const track=document.querySelector('#track'),counter=document.querySelector('#count'),current=document.querySelector('#current'),bar=document.querySelector('#bar'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),topBtn=document.querySelector('#top'),drawer=document.querySelector('#drawer'),menu=document.querySelector('#menu'),close=document.querySelector('#close'),scrim=document.querySelector('#scrim'),toc=document.querySelector('#toc'),viewport=document.querySelector('#viewport');
let index=Math.max(0,essays.findIndex(x=>x.slug===new URLSearchParams(location.search).get('essay'))),startX=0,startY=0,dx=0,dragging=false,horizontal=false;
marked?.setOptions?.({gfm:true,breaks:false});
function cleanMarkdown(text){return text.replace(/:contentReference\[[^\]]*\]\{index=\d+\}/g,'').replace(/^The Allegation\s*\n+/i,'')}
function renderMarkdown(text){const clean=cleanMarkdown(text);if(window.marked?.parse)return window.marked.parse(clean);const p=document.createElement('pre');p.textContent=clean;return p.outerHTML}
function buildSlides(){track.innerHTML=essays.map((e,i)=>`<section class="slide" data-index="${i}" aria-label="${e.title}"><article class="paper"><div class="eyebrow">${i===essays.length-1?'Source':`Essay ${String(i+1).padStart(2,'0')}`} · ${e.file}</div><h1 class="title">${e.title}</h1><p class="deck">${e.deck}</p><hr class="rule"><div class="content" id="content-${i}"><div class="loading">Loading essay…</div></div><div class="source"><span>Source</span><a href="${repo+encodeURIComponent(e.file).replace(/%2F/g,'/')}" target="_blank" rel="noopener">View original on GitHub ↗</a></div></article></section>`).join('');document.querySelectorAll('.slide').forEach(s=>s.addEventListener('scroll',()=>{if(+s.dataset.index===index)progress()},{passive:true}))}
function buildToc(){toc.innerHTML=essays.map((e,i)=>`<button data-go="${i}"><span class="n">${i===essays.length-1?'Source':`Essay ${String(i+1).padStart(2,'0')}`}</span><span class="t">${e.title}</span><span class="d">${e.deck}</span></button>`).join('');toc.onclick=e=>{const b=e.target.closest('[data-go]');if(!b)return;go(+b.dataset.go);closeDrawer()}}
async function loadEssay(i){const node=document.querySelector(`#content-${i}`);if(!node||node.dataset.loaded==='1')return;node.dataset.loaded='1';try{const r=await fetch(encodeURI(essays[i].file),{cache:'no-cache'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);node.innerHTML=renderMarkdown(await r.text())}catch(err){node.dataset.loaded='0';node.innerHTML=`<div class="error">Unable to load this essay. <a href="${repo+encodeURIComponent(essays[i].file)}" target="_blank" rel="noopener">Open the source on GitHub</a>.</div>`}}
function loadAround(i){loadEssay(i);if(i>0)loadEssay(i-1);if(i<essays.length-1)loadEssay(i+1)}
function progress(){const s=document.querySelector(`.slide[data-index="${index}"]`);if(!s)return;const max=s.scrollHeight-s.clientHeight;bar.style.width=`${max>0?Math.min(100,Math.max(0,s.scrollTop/max*100)):100}%`}
function sync(push=true){track.style.transform=`translate3d(${-index*100}%,0,0)`;counter.textContent=`${index+1} / ${essays.length}`;current.textContent=essays[index].title;prev.disabled=index===0;next.disabled=index===essays.length-1;document.title=`${essays[index].title} — Counsel Brief`;toc.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',+b.dataset.go===index));loadAround(index);progress();if(push){const u=new URL(location.href);u.searchParams.set('essay',essays[index].slug);history.replaceState(null,'',u)}}
function go(n,reset=true){n=Math.max(0,Math.min(essays.length-1,n));if(n===index)return;index=n;if(reset)document.querySelector(`.slide[data-index="${index}"]`)?.scrollTo({top:0,behavior:'instant'});sync()}
function openDrawer(){drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');close.focus()}function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');menu.focus()}
prev.onclick=()=>go(index-1);next.onclick=()=>go(index+1);topBtn.onclick=()=>document.querySelector(`.slide[data-index="${index}"]`)?.scrollTo({top:0,behavior:'smooth'});menu.onclick=openDrawer;close.onclick=closeDrawer;scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(drawer.classList.contains('open')){if(e.key==='Escape')closeDrawer();return}if(e.key==='ArrowLeft')go(index-1);if(e.key==='ArrowRight')go(index+1)});
viewport.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;startX=e.clientX;startY=e.clientY;dx=0;dragging=true;horizontal=false;track.classList.add('drag');viewport.setPointerCapture?.(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!dragging)return;const x=e.clientX-startX,y=e.clientY-startY;if(!horizontal&&Math.abs(x)>8)horizontal=Math.abs(x)>Math.abs(y)*1.15;if(!horizontal)return;dx=x;const edge=((index===0&&dx>0)||(index===essays.length-1&&dx<0))?.28:1;track.style.transform=`translate3d(${-index*viewport.clientWidth+dx*edge}px,0,0)`});
function endDrag(){if(!dragging)return;dragging=false;track.classList.remove('drag');if(horizontal&&Math.abs(dx)>Math.min(110,viewport.clientWidth*.18)){dx<0?go(index+1):go(index-1)}else sync(false);dx=0;horizontal=false}viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);
buildSlides();buildToc();sync(false);
</script>
</body>
</html>
